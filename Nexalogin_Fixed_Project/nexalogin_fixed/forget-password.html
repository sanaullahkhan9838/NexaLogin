<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nexalogin password reset interface demo.">
  <title>Nexalogin | Password Help Demo</title>
  <link rel="stylesheet" href="style.css">
  <script src="forget-password.js" defer></script>
</head>
<body>
  <main class="page-container">
    <section class="login-card">
      <div class="brand"><div class="brand-logo" aria-hidden="true">N</div><span>Nexalogin</span><span class="demo-tag">DEMO</span></div>
      <div class="demo-notice" role="note">Educational demo only. Password recovery is not connected and no email will be sent.</div>
      <div class="heading"><h1>Password help</h1><p>Preview a password recovery form.</p></div>
      <form id="resetForm" novalidate>
        <div class="form-group"><label for="email">Demo email address</label><input id="email" name="email" type="email" placeholder="demo@example.com" autocomplete="off" required></div>
        <button class="login-btn" type="submit">Preview reset action</button>
        <p id="message" class="message" aria-live="polite"></p>
      </form>
      <p class="signup-text"><a href="index.html">Back to sign in demo</a></p>
      <footer>© 2026 Nexalogin. Educational demo only.</footer>
    </section>
  </main>
</body>
</html>
